<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast - Weather Forecast</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app-container" class="app-container">
  <div class="main-wrapper">
    <header class="header">
      <div class="container header-content">
        <div class="logo-section">
          <div class="logo-icon"><span class="logo-emoji">🌤️</span></div>
          <h1 class="logo-text">SkyCast</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <i class="fas fa-sun"></i>
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </header>

    <main class="main-content container">
      <!-- Search -->
      <div class="search-section">
        <div class="search-input-container">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="search" class="search-input" placeholder="Search for a city...">
          <button id="searchBtn" class="search-button"><i class="fas fa-search"></i></button>
        </div>
      </div>

      <!-- Loader -->
      <div id="loader" class="loading-container hidden">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Weather Data...</div>
      </div>

      <!-- Current Weather -->
      <div id="current" class="current-weather-card hidden"></div>

      <!-- Weather Details -->
      <div id="details" class="weather-details-grid hidden"></div>

      <!-- Map -->
      <div id="map-container" class="map-container hidden">
        <iframe id="location-map" width="100%" height="300" style="border:2px solid #f07b00; border-radius:12px;" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <!-- Forecast -->
      <div id="forecast-grid" class="forecast-grid hidden"></div>

      <!-- Welcome Message -->
      <div id="welcome-message" class="welcome-message">
        <div class="welcome-card">
          <div class="welcome-icon">🌤️</div>
          <h2 class="welcome-title">Welcome to SkyCast</h2>
          <p class="welcome-text">Search for a city to get started with real-time weather information</p>
          <button id="use-location-btn" class="use-location-btn">Use My Location</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
